<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByLKI Grammar - Intermediate 1</title>
    <style>
        /* CSS für den glänzenden blauen Look */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f4c75 0%, #001f3f 100%);
            color: #e6f7ff;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #90caf9;
            text-shadow: 0 0 15px rgba(144, 202, 249, 0.5);
        }

        .exercise-container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            text-align: left;
        }

        .exercise-text {
            font-size: 1.1em;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        /* Styling für die Lücke und das Prompt */
        .gap-input-wrapper {
            display: inline-block;
            vertical-align: middle;
            margin: 0 3px;
        }

        .gap-input {
            width: 180px; /* Breite für lange Antworten */
            padding: 5px;
            border: 2px solid #66bbff;
            border-radius: 5px;
            background-color: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1em;
            transition: border-color 0.3s;
            text-align: center;
            margin-bottom: 5px;
        }

        .gap-prompt {
            display: block;
            font-size: 0.8em;
            color: #90caf9;
            text-align: center;
        }

        /* Feedback-Styles */
        .gap-input.correct {
            border-color: #4caf50; /* Grün */
            background-color: rgba(76, 175, 80, 0.2);
        }

        .gap-input.incorrect {
            border-color: #f44336; /* Rot */
            background-color: rgba(244, 67, 54, 0.2);
        }

        .feedback {
            color: #f44336;
            font-size: 0.9em;
            margin-top: 5px;
            padding: 5px 10px;
            border-left: 3px solid #f44336;
            background-color: rgba(244, 67, 54, 0.1);
            display: none; /* Initial versteckt */
        }

        .controls {
            text-align: center;
            margin-top: 30px;
        }

        .action-button {
            padding: 10px 25px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        #check-button {
            color: #001f3f;
            background: linear-gradient(145deg, #4caf50, #388e3c);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        #check-button:hover {
            background: linear-gradient(145deg, #81c784, #4caf50);
            transform: translateY(-2px);
        }

        #home-button {
            color: #ffffff;
            background: linear-gradient(145deg, #5c6bc0, #3949ab);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            text-decoration: none;
            padding: 10px 25px;
        }
        #home-button:hover {
            background: linear-gradient(145deg, #7986cb, #5c6bc0);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <header>
        <h1>Intermediate (B2+) - Übung 1: Tense Review & Gerunds</h1>
    </header>

    <div class="exercise-container">
        <div class="exercise-text" id="exercise-output">
            <!-- Text wird hier dynamisch über JavaScript generiert -->
        </div>

        <div class="controls">
            <button id="check-button" class="action-button" onclick="checkExercise()">Ergebnisse prüfen</button>
            <a href="index.html" id="home-button" class="action-button">Zurück zur Auswahl</a>
        </div>
        <div id="result-message" style="color: #4caf50; font-size: 1.2em; margin-top: 20px; text-align: center; display: none;"></div>
    </div>

    <script>
        // Datenstruktur für die Übungen
        const exerciseData = [
            // {prompt} ist der Text, der unter dem Eingabefeld erscheint
            // {textBefore} und {textAfter} umschließen die Lücke
            // {correctAnswers} muss *alle* akzeptierten Lösungen enthalten (inkl. Kurz- und Langformen)
            // {feedback} ist die Erklärung, die bei einem Fehler angezeigt wird
            
            // Lücke 1: Present Perfect
            {
                prompt: "(develop)",
                textBefore: "We live in an incredibly advanced time. While most of our technology",
                textAfter: "since the Industrial Revolution, many products we use today have a much longer history.",
                correctAnswers: ["has developed", "has been developed"], // Je nach Kontext kann "developed" oder "has been developing" auch akzeptabel sein.
                feedback: "Die Entwicklung der Technologie begann in der Vergangenheit (Industrial Revolution) und dauert bis heute an, daher ist das Present Perfect passend."
            },
            // Lücke 2: Past Perfect
            {
                prompt: "(be)",
                textBefore: "Before the famous perfume named Chanel No. 5 was invented, there",
                textAfter: "perfume production in Cyprus some 4,000 years ago.",
                correctAnswers: ["had been"],
                feedback: "Da die Parfümherstellung VOR der Erfindung von Chanel No. 5 stattfand (Vorzeitigkeit in der Vergangenheit), muss das Past Perfect verwendet werden (had been)."
            },
            // Lücke 3: Adverb
            {
                prompt: "(wide)",
                textBefore: "Among the most",
                textAfter: "used instruments is the odometer, which can measure the distance travelled by a vehicle.",
                correctAnswers: ["widely"],
                feedback: "Das gesuchte Wort beschreibt das Verb 'used' (wie es verwendet wird) und muss daher ein Adverb sein ('widely')."
            },
            // Lücke 4: If-Clause Type 1
            {
                prompt: "(come)",
                textBefore: "If you look for the inventor who created this tool, you",
                textAfter: "across Vitruvius, who is often credited with inventing it in 15 BC.",
                correctAnswers: ["will come"],
                feedback: "Dies ist eine If-Clause Typ 1 (reale Bedingung in der Gegenwart/Zukunft): If + Simple Present (look), Simple Future (will come)."
            },
            // Lücke 5: Simple Present
            {
                prompt: "(have)",
                textBefore: "Today, nearly every smartphone",
                textAfter: "an integrated compass.",
                correctAnswers: ["has"],
                feedback: "Da 'smartphone' Singular ist und es sich um eine allgemeingültige Tatsache handelt (Simple Present), muss die 3. Person Singular ('has') verwendet werden."
            },
            // Lücke 6: To-Infinitive (Prepositional Phrase)
            {
                prompt: "(???) construct",
                textBefore: "Historians think that the first people",
                textAfter: "a sophisticated compass were China’s Han Dynasty, around 200 BC.",
                correctAnswers: ["to"],
                feedback: "Nach Ordnungszahlen (first, second, last) wird oft der To-Infinitive verwendet, um den Zweck oder die Identität zu definieren ('the first people to construct')."
            },
            // Lücke 7: Simple Past Passive
            {
                prompt: "(magnetize)",
                textBefore: "The needle of the Chinese compass was actually an iron spoon that",
                textAfter: "with ore, making it point north or south.",
                correctAnswers: ["was magnetized"],
                feedback: "Die Handlung fand in der Vergangenheit statt (Simple Past), aber das Subjekt (spoon) führte die Handlung nicht selbst aus, sondern erlitt sie (Passive Voice: was + Past Participle)."
            },
            // Lücke 8: Superlativ Adjektiv
            {
                prompt: "(early)",
                textBefore: "The",
                textAfter: "maps of geographical places were created in Babylonia on clay tablets around 2300 BC.",
                correctAnswers: ["earliest"],
                feedback: "Das Wort 'the' und die Bedeutung ('die frühesten Karten') erfordern den Superlativ des Adjektivs ('earliest')."
            },
            // Lücke 9: Partizip als Adjektiv
            {
                prompt: "(know)",
                textBefore: "The oldest",
                textAfter: "map of the world is considered to be the Babylonian World Map.",
                correctAnswers: ["known"],
                feedback: "Das Partizip 'known' wird hier als Adjektiv verwendet, um die Karte zu beschreiben ('die älteste bekannte Karte')."
            },
            // Lücke 10: Comparison (than)
            {
                prompt: "(???)",
                textBefore: "To end on a sweet note, chocolate has been around for more",
                textAfter: "3,000 years and we have to thank the civilizations of ancient Mesoamerica for this sweetness in our lives.",
                correctAnswers: ["than"],
                feedback: "Bei einem Vergleich mit 'more' muss der zweite Teil des Vergleichs mit 'than' eingeleitet werden."
            }
        ];

        // Funktion zum Einfügen der Sätze in das HTML
        function renderSentences() {
            const outputDiv = document.getElementById('exercise-output');
            let html = '<p class="exercise-text">';
            
            exerciseData.forEach((item, index) => {
                const gapHtml = `
                    <span class="gap-input-wrapper">
                        <input type="text" id="gap-${index}" class="gap-input" placeholder="" aria-label="Lücke ${index + 1}">
                        <span class="gap-prompt">${item.prompt}</span>
                    </span>
                `;
                // Text zusammenfügen: Text vor Lücke + Lücke + Text nach Lücke
                html += `${item.textBefore} ${gapHtml} ${item.textAfter}`;
            });

            html += '</p>'; // Absatz schließen

            // Feedback-Boxen unterhalb des Textes (werden bei Fehler angezeigt)
            let feedbackHtml = '';
            exerciseData.forEach((item, index) => {
                feedbackHtml += `<div id="feedback-${index}" class="feedback"></div>`;
            });

            outputDiv.innerHTML = html + feedbackHtml;
        }

        // Hauptfunktion zur Überprüfung der Antworten
        function checkExercise() {
            let allCorrect = true;
            let correctCount = 0;

            exerciseData.forEach((item, index) => {
                const inputField = document.getElementById(`gap-${index}`);
                const feedbackDiv = document.getElementById(`feedback-${index}`);
                
                // Eingabe des Benutzers standardisieren: Kleinschreibung, überflüssige Leerzeichen entfernen
                const userAnswer = inputField.value.toLowerCase().trim().replace(/\s\s+/g, ' ');

                // Erstellung einer standardisierten Liste der korrekten Antworten
                const standardizedAnswers = item.correctAnswers.map(ans => ans.toLowerCase().trim().replace(/\s\s+/g, ' '));

                // Überprüfung
                if (standardizedAnswers.includes(userAnswer)) {
                    inputField.classList.remove('incorrect');
                    inputField.classList.add('correct');
                    feedbackDiv.style.display = 'none';
                    correctCount++;
                } else {
                    inputField.classList.remove('correct');
                    inputField.classList.add('incorrect');
                    
                    // Anzeige der Fehlererklärung
                    const answersDisplay = item.correctAnswers.map(ans => `"${ans}"`).join(' oder ');
                    feedbackDiv.textContent = `Lücke ${index + 1}: Falsch. Eine korrekte Lösung wäre z.B. ${answersDisplay}. Erklärung: ${item.feedback}`;
                    feedbackDiv.style.display = 'block';
                    allCorrect = false;
                }
            });

            const resultMessage = document.getElementById('result-message');
            resultMessage.style.display = 'block';

            if (allCorrect) {
                resultMessage.textContent = 'Glückwunsch! Alle Lücken korrekt ausgefüllt!';
                resultMessage.style.color = '#4caf50';
            } else {
                resultMessage.textContent = `Überprüfung abgeschlossen: ${correctCount} von ${exerciseData.length} Lücken korrekt. Bitte überprüfen Sie die markierten Fehler.`;
                resultMessage.style.color = '#f44336';
            }
        }

        // Starte die Anwendung
        document.addEventListener('DOMContentLoaded', renderSentences);
    </script>

</body>
</html>
